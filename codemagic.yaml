workflows:
  ios-capacitor-workflow:
    name: HudaAPP iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      node: latest
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
    scripts:
      - name: Install Core Dependencies
        script: |
          npm install
          npm install -g @capacitor/cli
          npm install @capacitor/core @capacitor/ios @capacitor/geolocation @capacitor/haptics @capacitor/local-notifications
      - name: Build Web Assets
        script: |
          npm run build
      - name: Create Structure and Manual Podfile
        script: |
          mkdir -p ios/App
          cat << 'EOF' > ios/App/Podfile
          platform :ios, '14.0'
          use_frameworks!
          target 'App' do
            pod 'Capacitor', :path => '../../node_modules/@capacitor/ios'
            pod 'CapacitorCordova', :path => '../../node_modules/@capacitor/ios'
          end
          EOF
      - name: Force Recreate iOS Platform Configuration
        script: |
          echo '{"appId":"com.hudaapp.app","appName":"HudaAPP","webDir":"dist"}' > capacitor.config.json
          npx cap add ios || true
          npx cap sync ios || true
      - name: CocoaPods Install Manual Check
        script: |
          cd ios/App && pod install --repo-update
      - name: Build and Package App
        script: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug -sdk iphoneos CODE_SIGNING_ALLOWED=NO OBJROOT=$PWD/build SYMROOT=$PWD/build || xcodebuild -project App.xcodeproj -scheme App -configuration Debug -sdk iphoneos CODE_SIGNING_ALLOWED=NO OBJROOT=$PWD/build SYMROOT=$PWD/build
          mkdir -p build/Payload
          cp -r build/Debug-iphoneos/*.app build/Payload/ || true
          cd build
          zip -r HudaAPP.ipa Payload
    artifacts:
      - ios/App/build/HudaAPP.ipa
      - ios/App/HudaAPP.ipa
