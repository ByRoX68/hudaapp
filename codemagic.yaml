workflows:
  ios-capacitor-workflow:
    name: HudaAPP iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      node: latest
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
    scripts:
      - name: Install dependencies
        script: | 
          npm install
          npm install @capacitor/ios
      - name: Build web assets
        script: | 
          npm run build
      - name: Recreate Fresh iOS Platform
        script: | 
          rm -rf ios
          npx cap add ios
      - name: Capacitor Sync iOS
        script: | 
          npx cap sync ios
      - name: CocoaPods Install
        script: | 
          cd ios/App && pod install
      - name: Build and Package App
        script: | 
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug -sdk iphoneos CODE_SIGNING_ALLOWED=NO OBJROOT=$PWD/build SYMROOT=$PWD/build
          mkdir -p build/Payload
          cp -r build/Debug-iphoneos/App.app build/Payload/
          cd build
          zip -r HudaAPP.ipa Payload
    artifacts:
      - ios/App/build/HudaAPP.ipa
