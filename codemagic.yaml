workflows:
  ios-capacitor-workflow:
    name: HudaAPP iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      node: latest
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
    scripts:
      - name: Install Core Dependencies
        script: |
          npm install
          npm install -g @capacitor/cli
          npm install @capacitor/core @capacitor/ios @capacitor/geolocation @capacitor/haptics @capacitor/local-notifications
      - name: Build Web Assets
        script: |
          npm run build
      - name: Force Recreate iOS Platform
        script: |
          rm -rf ios
          npx cap add ios --ext-config capacitor.config.json || npx cap add ios
      - name: Capacitor Sync iOS
        script: |
          npx cap sync ios
      - name: CocoaPods Install Manual Check
        script: |
          cd ios/App && pod install
      - name: Build and Package App
        script: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug -sdk iphoneos CODE_SIGNING_ALLOWED=NO OBJROOT=$PWD/build SYMROOT=$PWD/build
          mkdir -p build/Payload
          cp -r build/Debug-iphoneos/App.app build/Payload/
          cd build
          zip -r HudaAPP.ipa Payload
    artifacts:
      - ios/App/build/HudaAPP.ipa
